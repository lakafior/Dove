name: Release

# Release on a pushed tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# The tag must match MARKETING_VERSION in project.yml.
#
# Secrets:
#   DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD  Developer ID Application cert, signs the Mac app
#   NOTARY_KEY_P8_BASE64 / NOTARY_KEY_ID / NOTARY_ISSUER_ID   App Store Connect key: notarization and
#                                                             the provisioning profiles the entitlements need
# The iOS leg is not here yet: it needs the Apple Distribution cert (IOS_DISTRIBUTION_P12_*) and the
# notarization path for alternative distribution, which is not the same as notarytool. See docs/macos.md §9.
on:
  push:
    tags: [ "v*" ]
  # Run by hand to exercise signing and notarization without publishing anything:
  # the DMG comes back as a build artefact and the release step is skipped.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build, sign, notarize and publish the Mac app
    # The app builds with Xcode 27 (FoundationModels' `GenerationOptions(samplingMode:)` is `sampling:` in
    # Xcode 26's SDK). macos-26 images stop at Xcode 26.x; xcode-27 is GitHub's macOS 27 image (preview, 2026-10).
    runs-on: xcode-27
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Read the version, and on a tag check that it matches
        run: |
          VERSION="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?/\1/p' project.yml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No MARKETING_VERSION in project.yml"
            exit 1
          fi
          echo "project.yml version: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag: $TAG"
            if [[ "v$VERSION" != "$TAG" ]]; then
              echo "::error::Tag $TAG doesn't match MARKETING_VERSION $VERSION in project.yml"
              exit 1
            fi
          else
            echo "Manual run: building and notarizing, no release will be published."
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run the DoveKit tests
        run: cd Packages/DoveKit && swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::error::Secret DEVELOPER_ID_P12_BASE64 is missing"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$SIGN_ID" ]]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: $SIGN_ID"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Write the notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" ]]; then
            echo "::error::Secret NOTARY_KEY_P8_BASE64 is missing"
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Archive and export the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-mac.sh

      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/notarize.sh dist/Dove.app

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          ./scripts/make-dmg.sh
          ./scripts/notarize.sh dist/Dove.dmg
          mv dist/Dove.dmg "dist/Dove-$VERSION.dmg"
          (cd dist && shasum -a 256 "Dove-$VERSION.dmg" > "Dove-$VERSION.dmg.sha256")

      - name: Upload the DMG as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: Dove-${{ env.VERSION }}-dmg
          path: |
            dist/Dove-${{ env.VERSION }}.dmg
            dist/Dove-${{ env.VERSION }}.dmg.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/Dove-$VERSION.dmg" "dist/Dove-$VERSION.dmg.sha256" \
            --title "Dove $VERSION" --generate-notes --verify-tag

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
