name: Release

# Release on a pushed tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# The tag must match MARKETING_VERSION in project.yml.
#
# Secrets:
#   DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD  Developer ID Application cert, signs the Mac app
#   NOTARY_KEY_P8_BASE64 / NOTARY_KEY_ID / NOTARY_ISSUER_ID   App Store Connect key: notarization and
#                                                             the provisioning profiles the entitlements need
#   MAC_DEVELOPER_ID_PROFILES_BASE64   the app's and extensions' Developer ID profiles (.provisionprofile,
#                                      tar.gz): an API key may not create them, only the Account Holder
#   IOS_DISTRIBUTION_P12_BASE64 / IOS_DISTRIBUTION_P12_PASSWORD  Apple Distribution cert, signs the iOS
#                                                               build sent to App Store Connect
#
# Three things come out of a tag:
#   mac  the notarized DMG, and the GitHub release itself
#   ios  Dove-<version>-unsigned.ipa on the release (for sideloading), then the signed build uploaded to
#        App Store Connect and submitted for notarization
#   and, once Apple has approved it (hours to a day or two), altstore.yml attaches the package to the
#   release and lists the version in the AltStore PAL source. See docs/implemented.md › AltStore PAL.
on:
  push:
    tags: [ "v*" ]
  # Run by hand to exercise signing and notarization without publishing anything:
  # the DMG comes back as a build artefact and the release step is skipped.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build, sign, notarize and publish the Mac app
    # The app builds with Xcode 27 (FoundationModels' `GenerationOptions(samplingMode:)` is `sampling:` in
    # Xcode 26's SDK). macos-26 images stop at Xcode 26.x; xcode-27 is GitHub's macOS 27 image (preview, 2026-10).
    runs-on: xcode-27
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Read the version, and on a tag check that it matches
        run: |
          VERSION="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?/\1/p' project.yml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No MARKETING_VERSION in project.yml"
            exit 1
          fi
          echo "project.yml version: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag: $TAG"
            if [[ "v$VERSION" != "$TAG" ]]; then
              echo "::error::Tag $TAG doesn't match MARKETING_VERSION $VERSION in project.yml"
              exit 1
            fi
          else
            echo "Manual run: building and notarizing, no release will be published."
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run the DoveKit tests
        run: cd Packages/DoveKit && swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::error::Secret DEVELOPER_ID_P12_BASE64 is missing"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          SIGN_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ -z "$SIGN_ID" ]]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: $SIGN_ID"
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Write the notarization key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" ]]; then
            echo "::error::Secret NOTARY_KEY_P8_BASE64 is missing"
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Install the Developer ID provisioning profiles
        env:
          PROFILES_BASE64: ${{ secrets.MAC_DEVELOPER_ID_PROFILES_BASE64 }}
        run: |
          if [[ -z "$PROFILES_BASE64" ]]; then
            echo "::error::Secret MAC_DEVELOPER_ID_PROFILES_BASE64 is missing"
            exit 1
          fi
          # Their own folder for build-mac.sh to read (Xcode's also gets development profiles while archiving),
          # and a copy where Xcode looks for installed profiles.
          OWN="$RUNNER_TEMP/developer-id-profiles"
          XCODE="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$OWN" "$XCODE"
          echo "$PROFILES_BASE64" | base64 --decode | tar -xzf - -C "$OWN"
          cp "$OWN"/*.provisionprofile "$XCODE"/
          ls "$OWN"
          echo "MAC_PROFILES_DIR=$OWN" >> "$GITHUB_ENV"

      - name: Archive and export the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-mac.sh

      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/notarize.sh dist/Dove.app

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          ./scripts/make-dmg.sh
          ./scripts/notarize.sh dist/Dove.dmg
          mv dist/Dove.dmg "dist/Dove-$VERSION.dmg"
          (cd dist && shasum -a 256 "Dove-$VERSION.dmg" > "Dove-$VERSION.dmg.sha256")

      - name: Upload the DMG as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: Dove-${{ env.VERSION }}-dmg
          path: |
            dist/Dove-${{ env.VERSION }}.dmg
            dist/Dove-${{ env.VERSION }}.dmg.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/Dove-$VERSION.dmg" "dist/Dove-$VERSION.dmg.sha256" \
            --title "Dove $VERSION" --generate-notes --verify-tag

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

  ios:
    name: Build the iOS app, unsigned for sideloading and signed for notarization
    # After mac: that job runs the tests and creates the release these files are attached to.
    needs: mac
    runs-on: xcode-27
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Read the version and the build number
        run: |
          VERSION="$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?/\1/p' project.yml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::No MARKETING_VERSION in project.yml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the unsigned IPA
        run: ./scripts/build-ios.sh unsigned

      - name: Upload the unsigned IPA as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: Dove-${{ env.VERSION }}-unsigned-ipa
          path: dist/Dove-${{ env.VERSION }}-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Attach the unsigned IPA to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/Dove-$VERSION-unsigned.ipa" --clobber

      # From here on: the signed build for AltStore PAL. Only on a tag, because an upload to App Store
      # Connect cannot be taken back and its build number cannot be used twice.
      - name: Import the Apple Distribution certificate
        if: github.ref_type == 'tag'
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::error::Secret IOS_DISTRIBUTION_P12_BASE64 is missing"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # The runner image lacks Apple's WWDR G3 intermediate, without which the Distribution identity is
          # not valid for signing (Aicord's v0.1.13 release failed here, 2026-11-20).
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" || true
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution' || {
            echo "Identities in the keychain, valid or not:"
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::No valid 'Apple Distribution' identity in the imported certificate"
            exit 1
          }

      - name: Write the App Store Connect key
        if: github.ref_type == 'tag'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" ]]; then
            echo "::error::Secret NOTARY_KEY_P8_BASE64 is missing"
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Archive and upload to App Store Connect
        if: github.ref_type == 'tag'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-ios.sh upload

      - name: Keep the archive log on failure
        if: failure() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-signed-log
          path: dist/ios-archive.log
          if-no-files-found: ignore

      - name: Submit for notarization
        if: github.ref_type == 'tag'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: python3 scripts/asc-notarize.py --version "$VERSION" --build "$BUILD"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
