# XcodeGen spec. Generate the project with: xcodegen generate
# Dove.xcodeproj is generated and git-ignored; this file is the source of truth.
name: Dove
options:
  bundleIdPrefix: ovh.mar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DoveKit:
    path: Packages/DoveKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your team ID here or in Xcode

targets:
  Dove:
    type: application
    platform: iOS
    sources:
      - App/Dove
    dependencies:
      - package: DoveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ovh.mar.dove
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Dove:
    build:
      targets:
        Dove: all
    run:
      config: Debug
    test:
      config: Debug
      # Product > Test (⌘U) runs the DoveKit package tests.
      targets:
        - package: DoveKit/DoveKitTests
    archive:
      config: Release
  # TODO(stage-1): DoveShare (app extension, share sheet for magnets, links, .torrent and .nzb files),
  # sharing a Keychain access group with the app.
