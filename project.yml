# XcodeGen spec. Generate the project with: xcodegen generate
# Dove.xcodeproj is generated and git-ignored; this file is the source of truth.
name: Dove
options:
  bundleIdPrefix: net.smigi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DoveKit:
    path: Packages/DoveKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5TA8RF548P

targets:
  Dove:
    type: application
    platform: iOS
    sources:
      - App/Dove
      - App/Shared
    dependencies:
      - package: DoveKit
      - target: DoveShare
    info:
      path: App/Dove/Info.plist
      properties:
        # Read at runtime by SharedConfiguration.keychainGroup.
        DoveKeychainGroup: $(AppIdentifierPrefix)net.smigi.dove.shared
        # .torrent and .nzb have no system type; declaring them lets the share extension match the files.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
          - UTTypeIdentifier: org.newzbin.nzb
            UTTypeDescription: NZB file
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nzb]
              public.mime-type: [application/x-nzb]
    entitlements:
      path: App/Dove/Dove.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)net.smigi.dove.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # Share sheet: magnets, links, text with a magnet, .torrent and .nzb files straight to a debrid.
  DoveShare:
    type: app-extension
    platform: iOS
    sources:
      - App/DoveShare
      - App/Shared
    dependencies:
      - package: DoveKit
    info:
      path: App/DoveShare/Info.plist
      properties:
        CFBundleDisplayName: Dove
        DoveKeychainGroup: $(AppIdentifierPrefix)net.smigi.dove.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.bittorrent.torrent"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.newzbin.nzb"
              ).@count >= 1).@count >= 1
    entitlements:
      path: App/DoveShare/DoveShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)net.smigi.dove.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Dove:
    build:
      targets:
        Dove: all
    run:
      config: Debug
    test:
      config: Debug
      # Product > Test (⌘U) runs the DoveKit package tests.
      targets:
        - package: DoveKit/DoveKitTests
    archive:
      config: Release
