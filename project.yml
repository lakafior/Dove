# XcodeGen spec. Generate the project with: xcodegen generate
# Dove.xcodeproj is generated and git-ignored; this file is the source of truth.
name: Dove
options:
  bundleIdPrefix: net.smigi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DoveKit:
    path: Packages/DoveKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5TA8RF548P

targets:
  Dove:
    type: application
    platform: iOS
    sources:
      - App/Dove
      - App/Shared
      - App/Activity
      - App/Components
    dependencies:
      - package: DoveKit
      - package: DoveKit
        product: DoveAppCore
      - target: DoveShare
      - target: DoveFiles
      - target: DoveWidgets
    info:
      path: App/Dove/Info.plist
      properties:
        # Read at runtime by SharedConfiguration.keychainGroup.
        DoveKeychainGroup: $(AppIdentifierPrefix)net.smigi.dove.shared
        # Item kinds shared with the Files extension (SharedConfiguration.kindsURL).
        DoveAppGroup: group.net.smigi.dove
        # Dove opens magnet links and .torrent/.nzb files ("Open in Dove"). iOS has no default-app
        # setting for schemes: with several magnet apps installed it picks one on its own.
        CFBundleURLTypes:
          - CFBundleURLName: net.smigi.dove.magnet
            CFBundleURLSchemes: [magnet]
          # Widgets' links (DeepLink): dove://watchlist, dove://title/<id>…
          - CFBundleURLName: net.smigi.dove.app
            CFBundleURLSchemes: [dove]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent file
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.bittorrent.torrent]
          - CFBundleTypeName: NZB file
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.newzbin.nzb]
        # Jackett/Prowlarr (Torznab) and other self-hosted servers often live on the home network, over plain HTTP.
        # Local networking only (IPs, .local, single-label names): the internet stays HTTPS-only.
        NSLocalNetworkUsageDescription: Dove talks to servers you add on your home network, such as Jackett, Prowlarr or nzbdav.
        # Music metadata from Apple Music's catalog (AppleMusicCatalog, Settings › Music metadata); never the user's library.
        NSAppleMusicUsageDescription: Dove searches Apple Music's catalog for album covers, titles and track lists. It does not read or change your music library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Players Dove hands links to (ExternalPlayer.scheme): canOpenURL tells which are installed.
        LSApplicationQueriesSchemes: [infuse, vlc-x-callback, outplayer, senplayer, nplayer-https, open-vidhub]
        # Audiobooks keep playing with the screen locked (AudiobookPlayer); fetch: BackgroundRefresh.
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [net.smigi.dove.refresh]
        # Title and book screens advertise themselves to Spotlight (SpotlightIndex.viewActivity).
        NSUserActivityTypes: [net.smigi.dove.view]
        # "Search in Dove" under Spotlight's Search in Apps, for any text (RootView, CSQueryContinuationActionType).
        CoreSpotlightContinuation: true
        # Phone downloads on the Lock Screen and in the Dynamic Island (DownloadAlerts, DoveWidgets).
        NSSupportsLiveActivities: true
        # The app icon's menu (QuickActions); "Continue Listening" is added at runtime.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: net.smigi.dove.add-clipboard
            UIApplicationShortcutItemTitle: Add from Clipboard
            UIApplicationShortcutItemIconSymbolName: doc.on.clipboard
          - UIApplicationShortcutItemType: net.smigi.dove.search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
          - UIApplicationShortcutItemType: net.smigi.dove.watchlist
            UIApplicationShortcutItemTitle: Watchlist
            UIApplicationShortcutItemIconSymbolName: bookmark
          - UIApplicationShortcutItemType: net.smigi.dove.downloads
            UIApplicationShortcutItemTitle: Downloads
            UIApplicationShortcutItemIconSymbolName: arrow.down.circle
        # iCloud Drive › Dove: downloads kept in iCloud (DownloadDestination.iCloud), listed in the Library as a
        # place (FolderBackend). Public, so the folder shows in Files and in iCloud Drive on a Mac.
        NSUbiquitousContainers:
          iCloud.net.smigi.dove:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Dove
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Downloaded files (Documents) show in Files under On My iPhone › Dove.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # .torrent and .nzb have no system type; declaring them lets the share extension match the files.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
          - UTTypeIdentifier: org.newzbin.nzb
            UTTypeDescription: NZB file
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nzb]
              public.mime-type: [application/x-nzb]
    entitlements:
      path: App/Dove/Dove.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)net.smigi.dove.shared]
        # The File Provider extension requires an App Group (NSExtensionFileProviderDocumentGroup).
        com.apple.security.application-groups: [group.net.smigi.dove]
        # iCloud Drive › Dove (iCloud Documents). Builds re-signed without it (sideloading with another Apple ID)
        # keep every download on the device.
        com.apple.developer.icloud-container-identifiers: [iCloud.net.smigi.dove]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.net.smigi.dove]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # Share sheet: magnets, links, text with a magnet, .torrent and .nzb files straight to a debrid.
  DoveShare:
    type: app-extension
    platform: iOS
    sources:
      - App/DoveShare
      - App/Shared
    dependencies:
      - package: DoveKit
    info:
      path: App/DoveShare/Info.plist
      properties:
        CFBundleDisplayName: Dove
        DoveKeychainGroup: $(AppIdentifierPrefix)net.smigi.dove.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.bittorrent.torrent"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.newzbin.nzb"
              ).@count >= 1).@count >= 1
    entitlements:
      path: App/DoveShare/DoveShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)net.smigi.dove.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # The library as a location in the Files app (File Provider, replicated).
  DoveFiles:
    type: app-extension
    platform: iOS
    sources:
      - App/DoveFiles
    dependencies:
      - package: DoveKit
    info:
      path: App/DoveFiles/Info.plist
      properties:
        CFBundleDisplayName: Dove
        DoveKeychainGroup: $(AppIdentifierPrefix)net.smigi.dove.shared
        # Read by FilesContext for the working set snapshot.
        DoveAppGroup: group.net.smigi.dove
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: group.net.smigi.dove
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: App/DoveFiles/DoveFiles.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)net.smigi.dove.shared]
        com.apple.security.application-groups: [group.net.smigi.dove]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove.files
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # The Live Activity for phone downloads (drawn here, started and updated by the app).
  DoveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/DoveWidgets
      - App/Activity
      - App/Shared/BackendBadge.swift
    dependencies:
      - package: DoveKit
    info:
      path: App/DoveWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dove
        # Read by SharedConfiguration.appGroupContainer: the widgets draw the app's WidgetSnapshot.
        DoveAppGroup: group.net.smigi.dove
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/DoveWidgets/DoveWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.net.smigi.dove]
    settings:
      base:
        # ContinueAudiobookIntent's widget copy does not reach AppModel.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # The Mac app (docs/macos.md): its own SwiftUI shell over DoveAppCore. Same bundle ID as iOS (one App ID: the
  # iCloud container, MusicKit and iCloud Keychain carry over), sandboxed, macOS 26.
  DoveMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App/Mac
      - App/Components
      # The audiobook intent is shared with the iPhone; its widget-only parts are compiled out here.
      - App/Activity/ContinueAudiobookIntent.swift
      - App/Dove/DoveKitAliases.swift
      - App/Dove/Features/Settings
      - App/Dove/Features/Plugins/PluginsSettingsView.swift
      - App/Dove/Features/Common/CachedImage.swift
      - App/Shared/BackendBadge.swift
      - App/Shared/AddSourceView.swift
      # The app icon (Icon Composer) and accent colour, shared with iOS.
      - App/Dove/Resources
    dependencies:
      - package: DoveKit
      - package: DoveKit
        product: DoveAppCore
      - target: DoveMacWidgets
    info:
      path: App/Mac/Info.plist
      properties:
        # Read at runtime by SharedConfiguration.keychainGroup: the same group as iOS, so iCloud Keychain brings the
        # iPhone's keys, addons, indexers and preferences.
        DoveKeychainGroup: $(AppIdentifierPrefix)net.smigi.dove.shared
        CFBundleURLTypes:
          - CFBundleURLName: net.smigi.dove.app
            CFBundleURLSchemes: [dove]
          - CFBundleURLName: net.smigi.dove.magnet
            CFBundleURLSchemes: [magnet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent file
            CFBundleTypeExtensions: [torrent]
            CFBundleTypeRole: Viewer
          - CFBundleTypeName: NZB file
            CFBundleTypeExtensions: [nzb]
            CFBundleTypeRole: Viewer
        # Services menu: "Add to Dove" for selected text (magnets, links, hashes) and for .torrent/.nzb files in the Finder.
        NSServices:
          - NSMenuItem:
              default: Add to Dove
            NSMessage: addToDove
            NSPortName: Dove
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType, public.file-url, NSFilenamesPboardType]
        # "Search in Dove" under Spotlight's Search in Apps (CSQueryContinuationActionType).
        CoreSpotlightContinuation: true
        NSUserActivityTypes: [net.smigi.dove.view]
        # Read by SharedConfiguration.appGroupContainer: where the app writes the widgets' WidgetSnapshot.
        DoveAppGroup: group.net.smigi.dove
        NSLocalNetworkUsageDescription: Dove talks to servers you add on your home network, such as Jackett, Prowlarr or nzbdav.
        NSAppleMusicUsageDescription: Dove searches Apple Music's catalog for album covers, titles and track lists. It does not read or change your music library.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUbiquitousContainers:
          iCloud.net.smigi.dove:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Dove
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: App/Mac/DoveMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Folders the user picks (other download places, .torrent/.nzb files) and ~/Downloads, the default place.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        # The widgets read the app's WidgetSnapshot from here (WidgetSnapshotWriter).
        com.apple.security.application-groups: [group.net.smigi.dove]
        # Security-scoped bookmarks: the folders picked in Settings › Save to stay reachable after a restart.
        com.apple.security.files.bookmarks.app-scope: true
        keychain-access-groups: [$(AppIdentifierPrefix)net.smigi.dove.shared]
        com.apple.developer.icloud-container-identifiers: [iCloud.net.smigi.dove]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.net.smigi.dove]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_NAME: Dove
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

# Desktop widgets (docs/macos.md): the iPhone's home widgets, drawn from the same WidgetSnapshot in the App Group.
  DoveMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App/MacWidgets
      - path: App/DoveWidgets/HomeWidgets.swift
      - App/Shared/BackendBadge.swift
      - App/Activity/ContinueAudiobookIntent.swift
    dependencies:
      - package: DoveKit
    info:
      path: App/MacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dove
        # Read by SharedConfiguration.appGroupContainer: the widgets draw the app's WidgetSnapshot.
        DoveAppGroup: group.net.smigi.dove
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/MacWidgets/DoveMacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.net.smigi.dove]
    settings:
      base:
        # ContinueAudiobookIntent's widget copy does not reach AppModel.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        PRODUCT_BUNDLE_IDENTIFIER: net.smigi.dove.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dove
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Dove:
    build:
      targets:
        Dove: all
    run:
      config: Debug
    test:
      config: Debug
      # Product > Test (⌘U) runs the DoveKit package tests.
      targets:
        - package: DoveKit/DoveKitTests
    archive:
      config: Release
  DoveMac:
    build:
      targets:
        DoveMac: all
    run:
      config: Debug
    archive:
      config: Release
